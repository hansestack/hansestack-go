name: Release

# Go modules are served to consumers directly from the git tag by the module
# proxy, so there is no artifact to build or registry to push to. This workflow
# gates the tag on a green build and then publishes release notes.
on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so release notes can be generated

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Vulnerability Check
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: 'stable'
          work-dir: .

      - name: Test
        run: make test

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag

      - name: Warm module proxy
        continue-on-error: true
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Priming proxy.golang.org makes the version installable and visible
          # on pkg.go.dev immediately instead of on first external request.
          GOPROXY=proxy.golang.org go list -m \
            "github.com/hansestack/hansestack-go@${TAG}"
